name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: make clean && make
      - name: Install shellcheck
        run: brew install shellcheck
      - name: shellcheck
        run: shellcheck test/test.sh
      - name: py_compile
        run: python3 -I -m py_compile test/*.py
      - name: Install clang-format
        run: |
          python3 -m venv .venv-format
          .venv-format/bin/pip install clang-format==22.1.8
          echo "$PWD/.venv-format/bin" >> "$GITHUB_PATH"
      - name: Format check
        run: |
          clang-format --version
          make format-check
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit tests
        run: make test
      - name: Integration tests
        run: make integration
